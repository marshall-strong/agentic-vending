<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Weekly Vend · mock report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --paper: #fffdf5; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --ctx: #c3c2b7; --spark: #898781;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --crit: #d03b3b; --good: #006300; --warn: #fab219; --banner: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --paper: #211f19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --ctx: #4a4a47; --spark: #898781;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9;
    --crit: #e66767; --good: #0ca30c; --banner: #3a2f10;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --paper: #211f19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --ctx: #4a4a47; --spark: #898781;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9;
  --crit: #e66767; --good: #0ca30c; --banner: #3a2f10;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 14px 16px 40px; }
main { max-width: 1060px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }

.banner { background: var(--banner); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; margin-bottom: 14px; }
.mast { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; margin-bottom: 10px; }
.mast h1 { font-size: 15px; letter-spacing: .22em; text-transform: uppercase; font-weight: 750; }
.mast .tag { color: var(--ink2); font-size: 12.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.seg { display: inline-flex; gap: 3px; background: var(--surface); border: 1px solid var(--ring); border-radius: 999px; padding: 3px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; color: var(--ink2); font-size: 13px; padding: 6px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.seg button:hover { background: var(--grid); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg.small button { font-size: 12px; padding: 4px 9px; }

.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; position: relative; min-width: 0; }
.card > h2 { font-size: 15px; font-weight: 650; }
.card > .why { color: var(--ink2); font-size: 12.5px; margin: 1px 0 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 14px; margin-bottom: 14px; }
.stack { margin-bottom: 14px; }

/* newspaper */
.paper { background: var(--paper); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 18px 16px; margin-bottom: 14px; }
.paper .dateline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2);
  border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); padding: 4px 0; }
.paper h2 { font-size: clamp(24px, 4.2vw, 36px); line-height: 1.12; font-weight: 800; margin: 12px 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.paper .deck { color: var(--ink2); font-size: 15px; max-width: 70ch; }

/* figures */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.hero { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: end; justify-content: space-between; }
.hero .v { font-size: 56px; line-height: 1; font-weight: 750; letter-spacing: -.02em; }
.hero .acct { color: var(--ink2); font-size: 13px; max-width: 46ch; }
.hero .acct b { color: var(--ink); font-weight: 650; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .k { color: var(--ink2); font-size: 12px; }
.tile .v { font-size: 26px; font-weight: 700; line-height: 1.15; }
.delta { font-size: 12px; font-weight: 600; white-space: nowrap; }
.delta.good { color: var(--good); } .delta.bad { color: var(--crit); } .delta.flat { color: var(--ink2); }
.delta i { font-style: normal; font-weight: 400; color: var(--muted); }
.tile .n { color: var(--muted); font-size: 11.5px; min-height: 16px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg.spark { display: inline-block; width: auto; max-width: 100%; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .lbl { fill: var(--ink2); font-size: 11.5px; font-weight: 600; }
svg .val { fill: var(--ink); font-size: 12px; font-weight: 650; }
svg .hit { fill: transparent; cursor: default; }
svg .bar:hover, svg .hit:hover + .bar { opacity: .85; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin: 2px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 3px; }
.legend i.line { height: 3px; width: 14px; border-radius: 2px; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
.legend i.dia { width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  box-shadow: 0 4px 16px rgba(0,0,0,.18); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 180px; max-width: 260px; display: none; }
.tip b.t { display: block; margin-bottom: 4px; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.tip .row .a { color: var(--ink2); display: inline-flex; gap: 5px; align-items: center; }
.tip .row .b { font-weight: 650; }
.tip .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
.tip hr { border: 0; border-top: 1px solid var(--grid); margin: 5px 0; }
.tip .note { color: var(--ink2); margin-top: 3px; }

details { margin-top: 10px; font-size: 12.5px; }
summary { cursor: pointer; color: var(--ink2); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink2); font-size: 12px; }
.tablewrap { overflow-x: auto; }

/* awards */
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 8px; }
.award { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; }
.badge { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink);
  background: color-mix(in srgb, var(--hue) 24%, transparent); box-shadow: inset 0 0 0 2px var(--hue); }
.badge svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.award.locked .badge { background: transparent; box-shadow: inset 0 0 0 2px var(--axis); color: var(--muted); }
.award.locked .a-t { color: var(--muted); }
.a-k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.a-t { font-weight: 650; line-height: 1.25; }
.a-d { color: var(--ink2); font-size: 12px; }

/* advisor */
.advice { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.advice li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
  border-radius: 999px; padding: 2px 8px 2px 6px; box-shadow: inset 0 0 0 1px var(--axis); color: var(--ink); white-space: nowrap; justify-content: center; }
.chip .g { font-size: 10px; }
.chip.act .g { color: var(--crit); } .chip.watch .g { color: var(--warn); } .chip.good .g { color: var(--good); } .chip.note .g { color: var(--muted); }
.advice .a-title { font-weight: 650; }
.advice .a-body { color: var(--ink2); font-size: 13px; }

/* shelf */
.shelf th button { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; color: inherit; font-size: 12px; }
.shelf th button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.shelf td.name { min-width: 150px; }
.shelf .id { color: var(--muted); font-size: 11.5px; margin-right: 6px; }
.shelf .barcell { width: 190px; min-width: 120px; }
.barcell .b { display: flex; align-items: center; gap: 8px; }
.barcell .track { flex: 1; height: 8px; position: relative; }
.barcell .fill { height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 0; }
.shelf .chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.chip.sm { font-size: 10.5px; padding: 1px 7px 1px 5px; text-transform: none; letter-spacing: 0; }

/* goals */
.goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 22px; margin-top: 8px; }
.goal .gh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.goal .gt { font-weight: 650; }
.goal .gs { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.goal .gs b { color: var(--ink); }
.goal .gd { font-size: 12px; color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--s1) 22%, transparent); margin: 5px 0 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.meter.done i { background: var(--s1); }
.new { font-size: 10px; font-weight: 750; letter-spacing: .08em; background: var(--ink); color: var(--surface); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }

/* digest */
.digest pre { margin: 8px 0 0; padding: 10px 12px; background: var(--page); border: 1px solid var(--ring); border-radius: 8px; overflow: auto; max-height: 460px;
  font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink); white-space: pre; }
.digest .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 8px; }
.digest .meta { color: var(--ink2); font-size: 12px; }
.digest .copy { border: 1px solid var(--ring); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
.digest > summary { font-size: 15px; font-weight: 650; color: var(--ink); }
.foot { color: var(--muted); font-size: 12px; margin-top: 16px; }
@media (prefers-reduced-motion: no-preference) { .new { animation: pop .5s ease-out; } @keyframes pop { from { transform: scale(.6); opacity: 0; } } }
@media (max-width: 560px) { .hero .v { font-size: 44px; } .advice li { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>
<main id="app">
<noscript>This report needs JavaScript to build its tables and charts.</noscript>
</main>

<script>
"use strict";
/* =====================================================================
   MODEL  (pure data + rules; no DOM). Everything below is MOCK data.
   The money model follows the earlier money_chart_prototype: sales tax
   8% inside the price, drinks costed when sold, $25 midweek visits,
   API spend per run, same seeded stream for daily demand and API runs.
   New here: 20 slots, per-slot price/cost/stock, so sales have a shelf.
   ===================================================================== */
const DAY = 864e5;
const mkRng = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
// Weeks are the ledger's Saturday-Friday weeks (vending/ledger.py WEEK_STARTS = 5; the free Friday restock is the
// weekly reset). The competition starts Thu 3 Dec and runs 9 weeks (63 days, to Wed 3 Feb), so it spans 10 ledger
// weeks: Week 1 is Thu-Fri (2 days) and Week 10 is Sat-Wed (5 days). Both are "partial" weeks.
const OPENING = Date.UTC(2026, 10, 27), START = Date.UTC(2026, 11, 3), SEASON_DAYS = 63, WEEKS = 10;
const OPEN_CASH = 600, TAX = 0.08;
const isoOf = t => new Date(t).toISOString().slice(0, 10);
const dowOf = t => new Date(t).getUTCDay();
const weekStartOf = t => t - ((dowOf(t) + 1) % 7) * DAY;                       // the Saturday on or before t
const weekNo = t => Math.round((weekStartOf(t) - weekStartOf(START)) / (7 * DAY)) + 1;

// id = row*10 + column on the real machine. Names, prices, costs and popularity are invented.
const SLOTS = [
  { id: "11", name: "Fizz Cola",        price: 1.75, cost: 0.62, w: 12,  g: -0.2 },
  { id: "12", name: "Diet Fizz",        price: 1.75, cost: 0.62, w: 8,   g: 0.1 },
  { id: "13", name: "Lemon-Lime Spark", price: 1.75, cost: 0.62, w: 7,   g: 0 },
  { id: "14", name: "Root Beer Rumble", price: 1.75, cost: 0.65, w: 4,   g: -0.4 },
  { id: "21", name: "Orange Burst",     price: 1.75, cost: 0.62, w: 4,   g: 0 },
  { id: "22", name: "Ginger Snap Ale",  price: 2.05, cost: 0.80, w: 2,   g: 0.2 },
  { id: "23", name: "Peach Iced Tea",   price: 2.05, cost: 0.85, w: 5,   g: 0.6 },
  { id: "24", name: "Lemon Iced Tea",   price: 2.05, cost: 0.85, w: 4,   g: 0 },
  { id: "31", name: "Spring Water",     price: 1.50, cost: 0.35, w: 9,   g: 0.1 },
  { id: "32", name: "Sparkling Water",  price: 1.75, cost: 0.55, w: 5,   g: 0.9 },
  { id: "33", name: "Berry Sparkler",   price: 2.05, cost: 0.90, w: 2.5, g: -0.3 },
  { id: "34", name: "Grape Fizz",       price: 1.75, cost: 0.62, w: 2.5, g: -0.3 },
  { id: "41", name: "Blue Cooler",      price: 2.25, cost: 1.00, w: 6,   g: 0 },
  { id: "42", name: "Red Cooler",       price: 2.25, cost: 1.00, w: 4,   g: -0.2 },
  { id: "43", name: "Cold Brew Can",    price: 2.75, cost: 1.40, w: 4,   g: 1.3 },
  { id: "44", name: "Energy Zap",       price: 2.75, cost: 1.35, w: 6,   g: 0.4 },
  { id: "51", name: "Apple Juice",      price: 2.05, cost: 1.00, w: 2,   g: -0.3 },
  { id: "52", name: "Orange Juice",     price: 2.25, cost: 1.10, w: 2.5, g: 0.3 },
  { id: "53", name: "Coconut Water",    price: 2.75, cost: 1.50, w: 1,   g: -0.6 },
  { id: "54", name: "Cream Soda",       price: 1.75, cost: 0.65, w: 1.5, g: 0 },
];
const NS = SLOTS.length;
const BASE_DEMAND = [3, 6, 7, 7, 8, 8, 3];                 // by weekday, Sun..Sat: weekends quiet
const MIDWEEK = new Set(["2026-12-08", "2026-12-16", "2027-01-13"]);
// Mock demand shape: launch ramp, then a winter-break dip, then classes resume.
function demandMult(key) {
  if (key < "2026-12-06") return 0.5;
  if (key < "2026-12-10") return 0.7;
  if (key >= "2026-12-19" && key <= "2026-12-23") return 0.75;
  if (key >= "2026-12-24" && key <= "2027-01-02") return 0.3;
  if (key >= "2027-01-03" && key <= "2027-01-10") return 0.6;
  return 1;
}

const DAYS = [];
(function build() {
  const rnd = mkRng(7), rnd2 = mkRng(4242);                // rnd: same stream as the money prototype
  const stock = SLOTS.map(() => 0), par = SLOTS.map(() => 0);
  const totW = SLOTS.reduce((a, s) => a + s.w, 0);
  SLOTS.forEach((s, i) => { par[i] = Math.max(3, Math.round(1.8 * 42 * s.w / totW)); });
  let cash = OPEN_CASH, taxOwed = 0;
  const cum = { rev: 0, takings: 0, cogs: 0, visits: 0, tax: 0, api: 0 };
  const fillTo = want => {
    let cost = 0, n = 0, slots = 0;
    SLOTS.forEach((s, i) => { if (want(i) && stock[i] < par[i]) { const q = par[i] - stock[i]; stock[i] += q; cost += q * s.cost; n += q; slots++; } });
    return { cost, n, slots };
  };
  for (let t = OPENING; t < START + SEASON_DAYS * DAY; t += DAY) {
    const key = isoOf(t), dow = dowOf(t), live = t >= START;
    const week = live ? weekNo(t) : 0;
    const ev = [], runs = [];
    const stockStart = stock.map(q => q > 0);
    const sold = SLOTS.map(() => 0);
    let buy = 0, fee = 0, api = 0;
    if (key === "2026-12-02") { const r = fillTo(() => true); buy += r.cost; ev.push({ k: "fill", txt: `Day-one fill: ${r.n} drinks, $${r.cost.toFixed(2)}` }); }
    if (live) {
      const f = (t - START) / (62 * DAY);
      const n = Math.round(BASE_DEMAND[dow] * (0.7 + rnd() * 0.6) * demandMult(key));
      for (let k = 0; k < n; k++) {
        const ws = SLOTS.map((s, i) => (stock[i] > 0 ? s.w * Math.max(0.1, 1 + s.g * f) : 0));
        const tot = ws.reduce((a, b) => a + b, 0);
        if (!tot) break;
        let x = rnd2() * tot, i = 0;
        for (; i < NS; i++) { if (ws[i] > 0) { x -= ws[i]; if (x <= 0) break; } }
        if (i >= NS) i = ws.lastIndexOf(Math.max(...ws));
        stock[i]--; sold[i]++;
      }
    }
    const emptyEnd = stock.map(q => q === 0);               // empty at close of trading, before any restock
    if (live && dow === 5 && t > START) {                   // Friday: free visit, order-up-to par from the last 7 days
      const lastWeek = DAYS.filter(d => d.live && d.t >= t - 7 * DAY);
      if (lastWeek.length >= 7) SLOTS.forEach((s, i) => { par[i] = Math.max(3, Math.min(12, Math.ceil(1.6 * lastWeek.reduce((a, d) => a + d.sold[i], 0)))); });
      const r = fillTo(() => true); buy += r.cost;
      ev.push({ k: "fri", txt: `Friday restock: ${r.n} drinks, $${r.cost.toFixed(2)} (free visit)` });
    }
    if (MIDWEEK.has(key)) {
      fee = 25;
      const r = fillTo(i => stock[i] <= 1); buy += r.cost;
      ev.push({ k: "mid", txt: r.n ? `Midweek visit: $25 fee + ${r.slots} slot${r.slots === 1 ? "" : "s"} topped up ($${r.cost.toFixed(2)})` : "Midweek visit: $25 fee, no restock needed" });
    }
    if (t >= OPENING) {                                     // API: same shape as the money prototype
      const n = live ? 3 : 1;
      for (let i = 0; i < n; i++) { const c = +(0.03 + rnd() * 0.09).toFixed(3); api += c; runs.push({ p: "check-in", c }); }
      if (dow === 4) { const c = +(0.55 + rnd() * 0.7).toFixed(3); api += c; runs.push({ p: "weekly plan", c }); }
      if (MIDWEEK.has(key)) { api += 0.41; runs.push({ p: "midweek decision", c: 0.41 }); }
    }
    const units = sold.reduce((a, b) => a + b, 0);
    const takings = sold.reduce((a, q, i) => a + q * SLOTS[i].price, 0);
    const tax = takings * 8 / 108, rev = takings - tax;
    const cogs = sold.reduce((a, q, i) => a + q * SLOTS[i].cost, 0);
    cash += takings - fee - api - buy; taxOwed += tax;
    cum.takings += takings; cum.rev += rev; cum.cogs += cogs; cum.visits += fee; cum.tax += tax; cum.api += api;
    const inv = stock.reduce((a, q, i) => a + q * SLOTS[i].cost, 0);
    const spendable = cash - taxOwed;
    DAYS.push({ t, key, dow, live, week, sold, stockStart, emptyEnd, units, takings, tax, rev, cogs, fee, api, buy, runs, ev,
      spendable, inv, worth: spendable + inv, profit: cum.rev - cum.cogs - cum.visits - cum.api, cum: { ...cum } });
  }
})();

// ---- roll-ups --------------------------------------------------------
// SETUP = AI spend from the ledger opening (27 Nov) to launch. It is competition money (the ledger is open), so it
// counts against the season. Pre-competition dev/test API spend is NOT in this file at all.
const SETUP = (() => { const d = DAYS.filter(x => !x.live); return { api: d.reduce((a, x) => a + x.api, 0), buy: d.reduce((a, x) => a + x.buy, 0), runs: d.reduce((a, x) => a + x.runs.length, 0) }; })();
function rollup(days, wk) {
  const sum = k => days.reduce((a, d) => a + d[k], 0);
  const p = { n: wk, days, nd: days.length, partial: days.length < 7, start: days[0].t, end: days[days.length - 1].t,
    units: sum("units"), takings: sum("takings"), tax: sum("tax"), rev: sum("rev"), cogs: sum("cogs"), fee: sum("fee"), api: sum("api"), buy: sum("buy") };
  p.profit = p.rev - p.cogs - p.fee - p.api;
  p.slot = SLOTS.map((s, i) => {
    const u = days.reduce((a, d) => a + d.sold[i], 0), rv = u * s.price * 100 / 108;
    return { units: u, rev: rv, profit: rv - u * s.cost, emptyDays: days.filter(d => d.emptyEnd[i]).length };
  });

}
const P = [null];
for (let w = 1; w <= WEEKS; w++) P.push(rollup(DAYS.filter(d => d.week === w), w));
// season = weeks 1..upto; AI spend from the ledger opening to launch counts against the season, as in the ledger
function seasonOf(upto) {
  const p = rollup(DAYS.filter(d => d.live && d.week <= upto), 0);
  p.api += SETUP.api; p.profit -= SETUP.api; p.setupApi = SETUP.api; p.cumProfit = P[upto].cumProfit;
  return p;
}
const isFull = p => p.nd === 7;                               // a whole Sat-Fri week
const weekName = p => `Week ${p.n}` + (p.partial ? ` · ${p.nd} days` : "");

// Payback: the first day cash (after the sales-tax set-aside) is back to at least the $600 starting money, after
// the day-one fill took it below. (Net profit crossing $0 would say nothing: it is positive from the first sale.)
const PAYBACK = (() => { const d = DAYS.find(x => x.live && x.spendable >= OPEN_CASH); return d ? { t: d.t, week: d.week, cash: d.spendable } : null; })();
const paidBackBy = endT => (PAYBACK && PAYBACK.t <= endT ? PAYBACK : null);

// Fair week-over-week comparison. Two full weeks: compare totals. Otherwise compare only the weekdays both weeks
// have ("like for like"), and when fewer than 3 weekdays are shared say "partial week" instead of a % change.
function compareWeeks(p, prev) {
  if (!prev) return { kind: "none" };
  if (isFull(p) && isFull(prev)) return { kind: "full", cur: p, prev, n: 7, label: "last week" };
  const shared = [0, 1, 2, 3, 4, 5, 6].filter(dw => p.days.some(d => d.dow === dw) && prev.days.some(d => d.dow === dw));
  if (shared.length < 3) {
    const short = p.nd <= prev.nd ? p : prev;
    return { kind: "partial", n: shared.length, note: `${weekName(short).replace(" · ", ", ")} is too short to compare` };
  }
  const cd = p.days.filter(d => shared.includes(d.dow)), pd = prev.days.filter(d => shared.includes(d.dow));
  return { kind: "like", cur: rollup(cd, p.n), prev: rollup(pd, prev.n), n: shared.length, label: `the same ${shared.length} days last week` };
}
function zeroStreak(i, endT) {                               // trailing live days with stock on the shelf and no sale
  let n = 0;
  for (let k = DAYS.length - 1; k >= 0; k--) {
    const d = DAYS[k];
    if (d.t > endT) continue;
    if (!d.live || d.sold[i] > 0 || !d.stockStart[i]) break;
    n++;
  }
  return n;
}

// ---- views --------------------------------------------------------
// sel = 1..10 for a ledger week, 0 for "season so far" (all 10 ledger weeks = the 9-week season)
function viewFor(sel) {
  const season = sel === 0, upto = season ? WEEKS : sel;
  const weeks = P.slice(1, upto + 1);
  const p = season ? seasonOf(upto) : P[sel];
  const prev = season ? null : (P[sel - 1] || null);
  const endT = P[upto].end;
  const streak = SLOTS.map((s, i) => zeroStreak(i, endT));
  const cmp = season ? { kind: "none" } : compareWeeks(p, prev);
  return { sel, season, upto, weeks, p, prev, cmp, n: sel, streak, last: P[upto], paid: paidBackBy(endT) };
}
const ratio = (a, b) => (b > 0 ? a / b : null);
const profitPerApi = p => ratio(p.profit, p.api);
const slotsRanked = (p, key = "units") => SLOTS.map((s, i) => ({ s, i, ...p.slot[i] })).sort((a, b) => b[key] - a[key] || b.rev - a.rev || a.i - b.i);
const bestDayOf = p => p.days.reduce((b, d) => (d.rev > b.rev ? d : b), p.days[0]);
const quietDayOf = p => p.days.reduce((b, d) => (d.rev < b.rev ? d : b), p.days[0]);
const avgMargin = p => (p.units ? (p.rev - p.cogs) / p.units : 0);
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], WDL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const LEDGER_ORDER = [6, 0, 1, 2, 3, 4, 5];                  // Sat..Fri
const money = (v, dp = 2) => { const r = Math.round(v * 10 ** dp); return (r < 0 ? "−$" : "$") + (Math.abs(r) / 10 ** dp).toFixed(dp); };
const dShort = t => new Date(t).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const dLong = t => new Date(t).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const dRange = (a, b) => `${dShort(a)} – ${dShort(b)}, ${new Date(b).getUTCFullYear()}`;
const plural = (n, one, many) => (n === 1 ? one : many);
const names = (arr, k = 2) => arr.slice(0, k).join(", ") + (arr.length > k ? ` and ${arr.length - k} more` : "");
const r2 = v => Math.round(v * 100) / 100;

// ---- the newspaper headline: first matching rule wins -------------------------------
function makeHeadline(v) {
  const { p, prev } = v, n = v.n;
  const top = slotsRanked(p)[0], empties = p.slot.filter(x => x.emptyDays > 0).length;
  const deckBits = [];
  if (top && top.units > 0) deckBits.push(`${top.s.name} led the shelf with ${top.units} ${plural(top.units, "drink", "drinks")}.`);
  if (empties) deckBits.push(`${empties} ${plural(empties, "slot", "slots")} sold out.`);
  deckBits.push(`The AI cost ${money(p.api)} to run.`);
  const deck = deckBits.join(" ");
  if (v.season) {
    // best / toughest compare whole weeks only: a 2-day week would always look like the toughest
    const fw = v.weeks.filter(isFull);
    const best = fw.reduce((b, w) => (w.profit > b.profit ? w : b)), worst = fw.reduce((b, w) => (w.profit < b.profit ? w : b));
    const fp = fw.find(w => w.profit > 0);
    return { h: `Season wrap: ${money(p.profit)} profit from ${p.units} drinks`,
      deck: `Best full week was Week ${best.n} (${money(best.profit)}); toughest was Week ${worst.n} (${money(worst.profit)}). ` + (fp ? `First profitable full week: Week ${fp.n}. ` : "") +
        (v.paid ? `Paid back on ${dLong(v.paid.t)}. ` : "Not yet paid back. ") + `The AI cost ${money(p.api)} in total, ${money(SETUP.api)} of it from the ledger opening (27 Nov) to launch.` };
  }
  // Week-over-week % only on a fair basis (see compareWeeks): full vs full, or the same weekdays; never 2 days vs 7.
  const c = v.cmp, comparable = c.kind === "full" || c.kind === "like";
  const chg = comparable && c.prev.rev > 0 ? (c.cur.rev - c.prev.rev) / c.prev.rev : null;
  const vsTxt = c.kind === "like" ? `the same ${c.n} days last week` : "last week";
  const prevFull = P.slice(1, n).filter(isFull);
  const firstProfit = isFull(p) && p.profit > 0 && prevFull.every(q => q.profit <= 0);   // a 2-day week doesn't count
  const paidNow = !!(PAYBACK && PAYBACK.week === n);
  // why did sales fall? compare weekend and weekday revenue over the same weekdays last week
  let dipWhy = "";
  if (comparable && chg !== null && chg < 0) {
    const sumBy = (days, wkend) => days.filter(d => (d.dow === 0 || d.dow === 6) === wkend).reduce((a, d) => a + d.rev, 0);
    const cd = c.cur.days, pd = c.prev.days;
    const wkndChg = sumBy(pd, true) > 0 && sumBy(cd, true) > 0 ? sumBy(cd, true) / sumBy(pd, true) - 1 : null, wkdyChg = sumBy(pd, false) > 0 && sumBy(cd, false) > 0 ? sumBy(cd, false) / sumBy(pd, false) - 1 : null;
    const pairs = cd.map(d => ({ d, drop: pd.find(x => x.dow === d.dow).rev - d.rev }));
    const daysDown = pairs.filter(x => x.drop > 0).length;
    const worstDay = pairs.sort((a, b) => b.drop - a.drop)[0].d;
    dipWhy = wkndChg !== null && wkdyChg !== null && wkndChg <= wkdyChg - 0.15 ? "the weekend goes quiet" : daysDown >= Math.max(3, c.n - 1) ? "nearly every day slows" : `${WDL[worstDay.dow]} falls flat`;
  }
  const qd = quietDayOf(p);
  const prevBest = prevFull.reduce((m, q) => Math.max(m, q.profit), -Infinity);
  const partialNote = p.partial ? ` (${p.nd}-day week)` : "";
  if (firstProfit) return { h: `First profit! Week ${n} lands ${money(p.profit)} in the black`, deck: (prev && isFull(prev) ? `Last week: ${money(prev.profit)}. ` : "") + deck };
  if (paidNow) return { h: `Paid back! Cash is back to $${OPEN_CASH} on ${dLong(PAYBACK.t)}`, deck: `After the sales-tax set-aside, spendable cash is ${money(PAYBACK.cash)}. Week profit ${money(p.profit)}${partialNote}. ` + deck };
  if (p.profit < 0) {
    const cause = p.fee > 0 ? `the ${money(p.fee, 0)} visit fee outweighed ${money(p.rev - p.cogs)} of margin` : `margin of ${money(p.rev - p.cogs)} did not cover costs`;
    return { h: `In the red: Week ${n}${partialNote} ends ${money(Math.abs(p.profit))} short`, deck: `Why: ${cause}. ` + deck };
  }
  if (chg !== null && chg <= -0.15) return { h: `Sales dip ${Math.round(-chg * 100)}% as ${dipWhy}`, deck: `${money(c.cur.rev)} in sales vs ${money(c.prev.rev)} over ${vsTxt}${c.kind === "like" ? " (a like-for-like check, because this is a partial week)" : ""}; quietest day ${dLong(qd.t)}. ` + deck };
  if (chg !== null && chg >= 0.15) return { h: `Sales jump ${Math.round(chg * 100)}% ${c.kind === "like" ? `on ${vsTxt}` : `to ${money(p.rev)}`}`, deck: `Best day: ${dLong(bestDayOf(p).t)} at ${money(bestDayOf(p).rev)}. ` + (c.kind === "like" ? `${money(c.cur.rev)} vs ${money(c.prev.rev)} over the same days; partial week. ` : "") + deck };
  if (n >= 3 && isFull(p) && p.profit > prevBest) return { h: `Best week yet: ${money(p.profit)} profit`, deck };
  if (n === 1) return { h: `Doors open: ${p.units} drinks sold in ${p.nd} days, ${money(p.profit)} profit`, deck: `Week 1 is a short week (Thu–Fri); the ledger week runs Saturday to Friday. ` + deck };
  if (p.partial) return { h: `Short week (${p.nd} days): ${p.units} drinks sold, ${money(p.profit)} profit`, deck: `Not comparable with a full week's total. ` + deck };
  return { h: `Steady week: ${p.units} drinks sold, ${money(p.profit)} profit`, deck };
}

// ---- awards -------------------------------------------------------
function makeAwards(v) {
  const { p, prev, n } = v, out = [];
  const ranked = slotsRanked(p);
  const top = ranked[0];
  out.push(top.units > 0
    ? { code: "best_seller", icon: "star", hue: "--s4", kind: "Best seller", state: "earned", title: top.s.name, detail: `${top.units} ${plural(top.units, "drink", "drinks")} · slot ${top.s.id}` }
    : { code: "best_seller", icon: "star", hue: "--s4", kind: "Best seller", state: "locked", title: "Nothing sold", detail: "" });
  const earner = slotsRanked(p, "profit")[0];
  out.push({ code: "top_earner", icon: "coin", hue: "--s6", kind: "Top earner", state: "earned", title: earner.s.name, detail: `${money(earner.profit)} profit${earner.i !== top.i ? " (not the best seller)" : ""}` });
  // most improved: week = vs last week on a fair basis (full vs full, or the same weekdays);
  // season = last 3 full weeks vs first 3 full weeks (per-week average)
  let gains;
  const mi = (state, title, detail = "") => ({ code: "most_improved", icon: "trend", hue: "--s3", kind: "Most improved", state, title, detail });
  const c = v.cmp;
  if (v.season) {
    const fw = P.slice(1).filter(isFull), a = fw.slice(0, 3), b = fw.slice(-3);
    gains = SLOTS.map((s, i) => ({ s, d: b.reduce((x, q) => x + q.slot[i].units, 0) / 3 - a.reduce((x, q) => x + q.slot[i].units, 0) / 3 })).sort((x, y) => y.d - x.d);
    const g = gains[0];
    out.push(g.d >= 0.5 ? mi("earned", g.s.name, `+${g.d.toFixed(1)} drinks/wk, last 3 full wks vs first 3`) : mi("locked", "No big climbers"));
  } else if (c.kind === "full" || c.kind === "like") {
    gains = SLOTS.map((s, i) => ({ s, i, d: c.cur.slot[i].units - c.prev.slot[i].units })).sort((x, y) => y.d - x.d);
    const g = gains[0], need = Math.max(1, Math.round(2 * c.n / 7));
    out.push(g.d >= need ? mi("earned", g.s.name, `+${g.d} vs ${c.label} (${c.prev.slot[g.i].units} → ${c.cur.slot[g.i].units})`) : mi("locked", `No slot gained ${need}+`));
  } else if (c.kind === "partial") out.push(mi("locked", "Partial week", "Too few shared days to compare"));
  else out.push(mi("locked", "Needs a prior week"));
  if (v.season) {                                           // season: which slot ran dry in the most weeks
    const cnt = SLOTS.map((s, i) => ({ s, k: v.weeks.filter(w => w.slot[i].emptyDays > 0).length })).sort((a, b) => b.k - a.k)[0];
    out.push(cnt.k > 0 ? { code: "sold_out", icon: "box", hue: "--s2", kind: "Sell-out", state: "earned", title: cnt.s.name, detail: `ran dry in ${cnt.k} of ${WEEKS} ledger weeks` }
      : { code: "sold_out", icon: "box", hue: "--s2", kind: "Sell-out", state: "locked", title: "No slot ran dry", detail: "" });
  } else {
    const so = p.slot.map((x, i) => ({ i, d: x.emptyDays })).filter(x => x.d > 0).sort((a, b) => b.d - a.d);
    out.push(so.length ? { code: "sold_out", icon: "box", hue: "--s2", kind: "Sell-out", state: "earned", title: names(so.map(x => SLOTS[x.i].name), 2), detail: `empty up to ${so[0].d} ${plural(so[0].d, "day", "days")}` }
      : { code: "sold_out", icon: "box", hue: "--s2", kind: "Sell-out", state: "locked", title: "No slot ran dry", detail: "" });
  }
  // brain bill and first profit compare whole weeks only: a 2-day week is trivially cheap and easy to win
  const cb = (state, title, detail = "") => ({ code: "cheap_brain", icon: "coin", hue: "--s5", kind: "Cheapest brain bill", state, title, detail });
  if (v.season) {
    const c = v.weeks.filter(isFull).reduce((b, w) => (w.api < b.api ? w : b));
    out.push(cb("earned", `Week ${c.n}: ${money(c.api)}`, "lowest AI spend of a full week"));
  } else {
    const so_far = P.slice(1, n + 1).filter(isFull), c = so_far.length ? so_far.reduce((b, w) => (w.api < b.api ? w : b)) : null;
    out.push(!isFull(p) ? cb("locked", "Partial week", "Needs a full week")
      : so_far.length < 2 ? cb("locked", "Needs 2 full weeks")
      : c.n === n ? cb("earned", money(p.api), `lowest of ${so_far.length} full weeks so far`)
      : cb("locked", `Week ${c.n} holds it`, `${money(c.api)} vs ${money(p.api)} now`));
  }
  const fp = v.weeks.filter(isFull).find(w => w.profit > 0);
  out.push(!fp ? { code: "first_profit", icon: "ribbon", hue: "--s1", kind: "First profitable week", state: "locked", title: "Not yet", detail: p.partial && !v.season ? "Full weeks only" : "" }
    : { code: "first_profit", icon: "ribbon", hue: "--s1", kind: "First profitable week", state: "earned", title: `Week ${fp.n}`, detail: `${money(fp.profit)}${!v.season && fp.n === n ? " · won this week" : !v.season ? " · won earlier" : ""}` });
  const bd = bestDayOf(v.season ? { days: DAYS.filter(d => d.live) } : p);
  out.push({ code: "best_day", icon: "bolt", hue: "--s7", kind: "Best day", state: "earned", title: dLong(bd.t), detail: `${money(bd.rev)} · ${bd.units} drinks` });
  const worst = ranked[ranked.length - 1];
  out.push({ code: "wallflower", icon: "snow", hue: "--s1", kind: "Wallflower", state: "earned", title: worst.s.name, detail: `${worst.units} ${plural(worst.units, "drink", "drinks")} · slot ${worst.s.id}` });
  return out;
}

// ---- advisor: each rule looks at the numbers and may fire; code + data go into the digest too --------
function makeAdvice(v) {
  const { p, prev, n } = v, out = [];
  const cold = SLOTS.map((s, i) => ({ s, d: v.streak[i] })).filter(x => x.d >= 5).sort((a, b) => b.d - a.d);
  if (cold.length) out.push({ code: "slot_cold", level: "watch", title: `${cold.length} ${plural(cold.length, "slot has", "slots have")} not sold in 5+ days`,
    body: `${names(cold.map(x => `${x.s.name} (${x.d} days)`), 3)}. They sit on the shelf tying up stock; a free Friday visit is the place to swap them.`,
    data: { slots: cold.map(x => x.s.id), max_days: cold[0].d } });
  const dry = p.slot.map((x, i) => ({ s: SLOTS[i], d: x.emptyDays })).filter(x => x.d >= 2).sort((a, b) => b.d - a.d);
  if (dry.length) out.push({ code: "slot_empty", level: dry[0].d >= 3 ? "act" : "watch", title: `${dry.length} ${plural(dry.length, "slot", "slots")} sat empty for 2+ days`,
    body: `${names(dry.map(x => `${x.s.name} (${x.d} days)`), 3)}. A sold-out slot cannot sell. Order-up-to levels for these should go up.`,
    data: { slots: dry.map(x => ({ slot: x.s.id, days: x.d })) } });
  if (p.api > 0) {
    const share = p.profit > 0 ? p.api / p.profit : null;
    // A short week still carries a whole planning run, so its AI share is not comparable: soften the level and say so.
    const short = !v.season && p.partial, shortNote = short ? ` This is a ${p.nd}-day week that still holds a planning run, so it overstates the share.` : "";
    if (share === null) out.push({ code: "api_no_profit", level: short ? "watch" : "act", title: "AI spend with no profit behind it", body: `The AI cost ${money(p.api)} and the ${short ? `${p.nd} days` : "week"} made ${money(p.profit)}.${shortNote}`, data: { api: r2(p.api), profit: r2(p.profit), partial_week: short } });
    else if (share > 0.15) out.push({ code: "api_share_high", level: short ? "note" : "watch", title: `The AI took ${Math.round(share * 100)}% of the profit`, body: `${money(p.api)} on AI against ${money(p.profit)} profit. ${short ? "" : "Fewer or shorter runs would keep more of it."}${shortNote}`.replace(/\s+/g, " ").trim(), data: { api_pct_of_profit: Math.round(share * 100), partial_week: short } });
    else out.push({ code: "api_share_ok", level: "good", title: `Every AI dollar returned ${money(p.profit / p.api, 0)}`, body: `${money(p.api)} of AI spend against ${money(p.profit)} profit (${Math.round(share * 100)}% of it).`, data: { profit_per_api: r2(p.profit / p.api) } });
  }
  if (p.fee > 0) {
    const m = avgMargin(p), k = m > 0 ? Math.ceil(p.fee / m) : null;
    out.push({ code: "visit_fee", level: "note", title: `Visit fees cost ${money(p.fee, 0)} this ${v.season ? "season" : "week"}`,
      body: k ? `At ${money(m)} margin per drink, that is ${k} drinks just to pay for the visits. Free Friday visits are cheaper.` : `No margin to set it against.`, data: { fee: p.fee, drinks_to_cover: k } });
  }
  const avgM = avgMargin(p);
  if (avgM > 0 && (v.season || p.nd >= 4)) {                // a 2-3 day week is too little sales to call a slot slow
    const med = [...p.slot.map(x => x.units)].sort((a, b) => a - b)[NS >> 1];
    const gem = SLOTS.map((s, i) => ({ s, m: p.slot[i].units ? p.slot[i].profit / p.slot[i].units : s.price * 100 / 108 - s.cost, u: p.slot[i].units }))
      .filter(x => x.m >= 1.3 * avgM && x.u <= med).sort((a, b) => b.m - a.m)[0];
    if (gem) out.push({ code: "high_margin_slow", level: "note", title: `${gem.s.name} earns well but sells slowly`, body: `${money(gem.m)} profit per drink against ${money(avgM)} on average, with only ${gem.u} sold. A better spot or price might lift it.`, data: { slot: gem.s.id, margin: r2(gem.m), avg_margin: r2(avgM), units: gem.u } });
  }
  if (!v.season && n >= 3 && n < WEEKS) {
    // per-day pace over the last 21 days up to this week's end, run forward over the days left (not "weeks left"):
    // the season is 63 days and does not end on a week boundary
    const live = DAYS.filter(d => d.live && d.t <= p.end), recent = live.slice(-21), left = SEASON_DAYS - live.length;
    const perDay = recent.reduce((a, d) => a + d.rev - d.cogs - d.fee - d.api, 0) / recent.length, proj = p.cumProfit + perDay * left;
    out.push({ code: "pace", level: "note", title: `Pace: about ${money(proj, 0)} by the end of the season`, body: `Straight-line from the last ${recent.length} days (${money(perDay)} a day, ${money(perDay * 7)} a week) over the ${left} days left. A rough guide: it ignores breaks and visits.`, data: { per_day: r2(perDay), days_left: left, projected_season_profit: Math.round(proj) } });
  }
  if (!cold.length && !dry.length) out.push({ code: "shelves_ok", level: "good", title: "Shelves in good shape", body: "No slot sat empty for 2+ days and none went cold for 5.", data: {} });
  const rank = { act: 0, watch: 1, good: 2, note: 3 };
  out.sort((a, b) => rank[a.level] - rank[b.level]);
  return out.slice(0, 4);
}

// ---- goals ------------------------------------------------------------
const GOAL_DEFS = [
  { code: "paid_back", title: "Paid back", desc: `Cash, after the sales-tax set-aside, is back to the $${OPEN_CASH} starting money`, target: OPEN_CASH, kind: "cash" },
  { code: "profit_50", title: "$50 club", desc: "Season profit reaches $50", target: 50, kind: "profit" },
  { code: "profit_100", title: "$100 club", desc: "Season profit reaches $100", target: 100, kind: "profit" },
  { code: "profit_150", title: "$150 club", desc: "Season profit reaches $150", target: 150, kind: "profit" },
  { code: "profit_200", title: "$200 club", desc: "Season profit reaches $200", target: 200, kind: "profit" },
  // The weekly flags look at whole (7-day) weeks only: Week 1 (2 days) and Week 10 (5 days) are too short to win them.
